# Model - Apertus 8B
model_name_or_path: swiss-ai/Apertus-8B-Instruct-2509
dtype: float16  # Changed from torch_dtype (deprecated)
attn_implementation: eager
load_in_8bit: true  # 8-bit quantization to save memory

# Dataset
dataset_name: HuggingFaceH4/Multilingual-Thinking
dataset_num_proc: 4
dataset_text_field: messages

# Training parameters - Optimized for 8B model
learning_rate: 2.0e-4
gradient_checkpointing: true
gradient_checkpointing_kwargs:
  use_reentrant: false
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 8  # Effective batch size = 8
max_grad_norm: 0.3

# Logging for real-time progress
logging_steps: 1  # Log every step for real-time feedback
logging_first_step: true
logging_strategy: steps
report_to: "none"  # Disable wandb/tensorboard for cleaner output

# LoRA Configuration for 8B
use_peft: true
lora_r: 8  # Standard rank for 8B
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]

# Sequence length
max_length: 512
packing: false

# Memory optimizations
optim: adamw_torch_fused
fp16: true
tf32: false
dataloader_num_workers: 0

# Output & checkpointing
output_dir: ./apertus_8b_lora_20250926_220554
save_strategy: steps
save_steps: 100
save_total_limit: 2
seed: 42
